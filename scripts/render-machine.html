<!doctype html>
<!-- Genera public/img/maquina-3d.jpg: la máquina del visor 3D, en blanco sobre negro y en vista de tres cuartos.
     Uso: npm run dev, y captura esta página (/scripts/render-machine.html) a 1200×960 con Chrome headless. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { machine } from '/src/components/hall3d.ts';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .18;
machine(scene)(1.1); // pose fija

// Todo en blanco mate, como un vaciado de escayola.
const white = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: .55, metalness: 0 });
scene.traverse(o => { if (o.isMesh) { o.material = white; o.castShadow = o.receiveShadow = true; } });
// Suelo negro: tapa la mitad inferior del volante (en la sala la tapa el suelo).
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: 0x000000 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(-7, 8, 9); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(7, 6, -5);
scene.add(key, rim, new THREE.HemisphereLight(0xffffff, 0x000000, .25));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 100);
camera.position.set(-9.2, 3.6, 11.6); camera.lookAt(.4, 1.9, 0);
renderer.render(scene, camera);
document.title = 'ready';
</script></body></html>
